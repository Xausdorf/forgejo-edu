services:
  forgejo:
    build:
      context: ..
      dockerfile: edu-docker/Dockerfile.dev
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data
      - forgejo-shared:/shared
    restart: unless-stopped

  # Forgejo Actions runner — executes CI/CD workflows from .forgejo/workflows/
  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:6.3.1
    user: root
    depends_on:
      - forgejo
    volumes:
      - runner-data:/data
      - forgejo-shared:/shared:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FORGEJO_URL=http://forgejo:3000
      - RUNNER_NAME=edu-docker-runner
      - RUNNER_LABELS=ubuntu-latest:docker://node:20-bookworm,docker:docker://node:20-bookworm
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Forgejo at $$FORGEJO_URL ..."
        until wget -qO- "$$FORGEJO_URL/api/v1/version" >/dev/null 2>&1; do
          sleep 2
        done
        echo "Forgejo is ready."

        if [ -f /data/.runner ]; then
          echo "Runner already registered, starting daemon..."
          exec forgejo-runner daemon --config /data/config.yml
        fi

        echo "Waiting for /shared/runner-token from forgejo container..."
        until [ -s /shared/runner-token ]; do
          sleep 2
        done
        REG_TOKEN=$$(tr -d '[:space:]' < /shared/runner-token)
        echo "Got registration token from shared volume."

        mkdir -p /data
        cat > /data/config.yml <<'CFGEOF'
        log:
          level: info
        runner:
          capacity: 2
          timeout: 30m
          insecure: true
          fetch_timeout: 5s
          fetch_interval: 2s
        container:
          network: ""
          privileged: false
          options:
          valid_volumes:
            - /var/run/docker.sock
        CFGEOF

        # Register the runner
        cd /data
        forgejo-runner register \
          --instance "$$FORGEJO_URL" \
          --token "$$REG_TOKEN" \
          --name "$$RUNNER_NAME" \
          --labels "$$RUNNER_LABELS" \
          --no-interactive

        echo "Runner registered. Starting daemon..."
        exec forgejo-runner daemon --config /data/config.yml
    restart: unless-stopped

  # Run integration tests (one-shot)
  test-integration:
    build:
      context: ..
      dockerfile: edu-docker/Dockerfile.test
    profiles: ["test"]
    environment:
      - GITEA_ROOT=/app
      - CGO_ENABLED=1

  # Run unit tests (one-shot)
  test-unit:
    build:
      context: ..
      dockerfile: edu-docker/Dockerfile.test
    profiles: ["test"]
    command: ["go", "test", "-tags", "sqlite sqlite_unlock_notify", "./internal/edu/..."]
    environment:
      - CGO_ENABLED=1

  # Run E2E tests (one-shot, requires Playwright + Chromium)
  test-e2e:
    build:
      context: ..
      dockerfile: edu-docker/Dockerfile.e2e
    profiles: ["test"]
    environment:
      - GITEA_ROOT=/app
      - CGO_ENABLED=1
      - PLAYWRIGHT_PROJECT=chromium

volumes:
  forgejo-data:
  runner-data:
  forgejo-shared:
